name: Build share cover for Padrão Pneus

on:
  push:
    branches:
      - desenvolvimento-v1
    paths:
      - assets/og/padrao-pneus-card.svg
      - assets/og/render-card.py
      - .github/workflows/build-og-cover.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render 1200x630 branded JPEG using real assets
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python assets/og/render-card.py
      - name: Commit compatible JPEG cover to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/padrao-pneus-card.jpg
          if ! git diff --cached --quiet; then
            git commit -m "build(og): export branded social sharing preview"
            git push origin HEAD:desenvolvimento-v1
          fi
