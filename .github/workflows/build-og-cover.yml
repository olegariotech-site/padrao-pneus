name: Build share cover for Padrão Pneus

on:
  push:
    branches:
      - desenvolvimento-v1
    paths:
      - assets/og/padrao-pneus-card.svg
      - .github/workflows/build-og-cover.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render 1200x630 PNG from SVG source
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg
          src = Path('assets/og/padrao-pneus-card.svg')
          png = Path('assets/og/padrao-pneus-card.png')
          jpg = Path('assets/og/padrao-pneus-card.jpg')
          cairosvg.svg2png(url=str(src),write_to=str(png),output_width=1200,output_height=630)
          with Image.open(png) as im:
              if im.size != (1200,630):
                  raise RuntimeError(f'Unexpected image dimensions {im.size}')
              im.convert('RGB').save(jpg,'JPEG',quality=81,optimize=True,progressive=True,subsampling=0)
          if jpg.stat().st_size > 600_000:
              with Image.open(png) as im:
                  im.convert('RGB').save(jpg,'JPEG',quality=72,optimize=True,progressive=True,subsampling=2)
          if jpg.stat().st_size > 600_000:
              raise RuntimeError('JPG exceeds WhatsApp recommended 600 kB limit')
          print(f'OG JPG ready: {jpg.stat().st_size} bytes, 1200x630')
          PY
      - name: Commit compatible JPEG cover to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/padrao-pneus-card.jpg assets/og/padrao-pneus-card.png
          if ! git diff --cached --quiet; then
            git commit -m "build(og): export branded social sharing preview"
            git push origin HEAD:desenvolvimento-v1
          fi
